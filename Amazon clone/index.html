<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amazon Clone</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-2 sticky-top shadow">
    <a class="navbar-brand fw-bold fs-3" href="#">Amazon<span class="text-warning">.New</span></a>
    <form class="d-flex ms-auto" role="search">
      <input class="form-control me-2 rounded-pill" type="search" placeholder="Search products" id="searchBox">
    </form>
    <div class="cart text-white ms-3 fs-5">🛒 Cart (0)</div>
  </nav>

  <!-- Main Product Grid -->
  <div class="container py-4">
    <div class="row" id="productGrid">
      <!-- Product cards will be inserted here -->
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
